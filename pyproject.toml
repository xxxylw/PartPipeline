[project]
name = "partpipeline"
version = "0.1.0"
description = "Pipeline for GLB part segmentation with SAMPart3D and part completion with HoloPart."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "trimesh>=4",
  "numpy>=1.24",
]

[project.scripts]
partpipeline = "partpipeline.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
